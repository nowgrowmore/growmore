[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "growmore-bot"
version = "0.1.0"
description = "MCX commodity paper-trading engine (Dhan data API, backtesting, paper trading)."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "dhanhq",
    "sqlalchemy>=2.0",
    "alembic",
    "psycopg[binary]",
    "apscheduler",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pandas",
    "python-dotenv",
    "pytz",
    "pyotp",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "responses",
    "ruff",
    "mypy",
]
# Only for the one-off small-cap momentum research (bot/research/), never
# imported by the live trading bot -- kept out of the core dependency list
# so the production install stays lean. See bot/research/smallcap_momentum/.
research = [
    "yfinance",
    "pyarrow",
    # Technical-indicator library for research/mcx_options/regime.py (ADX,
    # +DI/-DI, Bollinger Bandwidth). The upstream `pandas_ta` PyPI project's
    # only remaining releases (0.4.67b0/0.4.71b0, checked 2026-09-14)
    # require Python >=3.12 and its GitHub source (twopirllc/pandas-ta) has
    # been taken down, so it cannot be installed into this project's >=3.10
    # environment. `pandas-ta-classic` is the actively maintained
    # community fork that kept the original API and py3.10 support; it
    # installs under the distribution name `pandas-ta-classic` but is
    # imported as `pandas_ta_classic` and registers the same `df.ta.*`
    # accessor (ADX_14/DMP_14/DMN_14, BBB_20_2.0, etc.) that `pandas_ta`
    # always did. See research/mcx_options/regime.py's docstring.
    "pandas-ta-classic",
    # TLS-fingerprint-impersonating HTTP client for research/mcx_options/fetch.py.
    # mcxindia.com sits behind Akamai Bot Manager, which blocks plain `requests`/
    # `curl` (confirmed: even a cold GET of robots.txt 403s) purely on TLS/JA3
    # fingerprint -- a real browser passes, `requests`'s OpenSSL-based handshake
    # doesn't. `curl_cffi` replays an actual Chrome TLS handshake and gets a
    # clean 200 where `requests` cannot, confirmed live against
    # market-data/bhavcopy and its GetDateWiseBhavCopy/GetCommoditywiseBhavCopy
    # JSON endpoints. See fetch.py's docstring for the full story (including
    # what NOT to do: this project does not attempt to reverse-engineer
    # Akamai's own sensor/challenge script -- TLS impersonation plus a
    # same-origin warm-up GET, both well short of that, are what's used here).
    "curl_cffi",
]

[project.scripts]
growmore-bot = "growmore_bot.main:main"

[tool.setuptools.packages.find]
include = ["growmore_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep this focused: real correctness/style issues (pycodestyle errors,
# pyflakes, import sorting), not the full opinionated preview ruleset.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
